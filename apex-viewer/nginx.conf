server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # designs.json is ~6 MB of text — gzip drops it to under 1 MB.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite assets never change — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Data is prepared at container start from the mounted JSONL, so it can change
    # between restarts — make the browser revalidate instead of holding a stale copy.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # Never cache the HTML entry point, so a reload always picks up a new build/data.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
